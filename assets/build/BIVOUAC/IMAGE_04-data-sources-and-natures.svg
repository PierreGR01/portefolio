<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Calibri, Carlito, Candara, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- TOKENS  paper #F5F1E8 · green #2D5016 · terra #B85C1A · grey #6B655C · ink #2A2724 -->
  <rect x="0" y="0" width="1200" height="830" fill="#F5F1E8"/>

  <text x="40" y="56" font-size="38" fill="#2A2724">Three sources, three kinds of truth</text>
  <line x1="40" y1="78" x2="1160" y2="78" stroke="#2A2724" stroke-width="2"/>

  <!-- column headers -->
  <g font-size="21" fill="#6B655C">
    <text x="40" y="118">Where it comes from</text>
    <text x="470" y="118">How it is processed</text>
    <text x="800" y="118">What the user sees</text>
  </g>
  <line x1="40" y1="134" x2="1160" y2="134" stroke="#B6AE9E" stroke-width="1.5"/>

  <!-- arrows -->
  <g fill="none" stroke="#B6AE9E" stroke-width="2">
    <path d="M420 230 L 462 230"/><path d="M455 223 L 462 230 L 455 237"/>
    <path d="M750 230 L 792 230"/><path d="M785 223 L 792 230 L 785 237"/>
    <path d="M420 410 L 462 410"/><path d="M455 403 L 462 410 L 455 417"/>
    <path d="M750 410 L 792 410"/><path d="M785 403 L 792 410 L 785 417"/>
    <path d="M420 590 L 462 590"/><path d="M455 583 L 462 590 L 455 597"/>
    <path d="M750 590 L 792 590"/><path d="M785 583 L 792 590 L 785 597"/>
  </g>

  <!-- LANE 1 · institutional -->
  <g>
    <rect x="40" y="160" width="380" height="140" fill="#FFFFFF"/>
    <rect x="40" y="160" width="380" height="5" fill="#2D5016"/>
    <text x="62" y="206" font-size="26" fill="#2A2724">INPN protected areas</text>
    <text x="62" y="240" font-size="22" fill="#6B655C">Park and reserve decrees</text>
    <text x="62" y="272" font-size="22" fill="#6B655C">Prefectural orders</text>

    <rect x="470" y="160" width="280" height="140" fill="#EDE7D8"/>
    <text x="492" y="206" font-size="24" fill="#2A2724">Read by hand,</text>
    <text x="492" y="238" font-size="24" fill="#2A2724">then maintained by</text>
    <text x="492" y="270" font-size="24" fill="#2A2724">the territory itself</text>

    <rect x="800" y="160" width="360" height="140" fill="#2D5016"/>
    <text x="822" y="206" font-size="26" fill="#F5F1E8">Institutional</text>
    <text x="822" y="240" font-size="22" fill="#C9D6B8">Regulated zones, always</text>
    <text x="822" y="272" font-size="22" fill="#C9D6B8">credited to their author</text>
  </g>

  <!-- LANE 2 · computed -->
  <g>
    <rect x="40" y="340" width="380" height="140" fill="#FFFFFF"/>
    <rect x="40" y="340" width="380" height="5" fill="#B85C1A"/>
    <text x="62" y="386" font-size="26" fill="#2A2724">OpenStreetMap</text>
    <text x="62" y="420" font-size="22" fill="#6B655C">Queried through Overpass</text>
    <text x="62" y="452" font-size="22" fill="#6B655C">IGN BD TOPO</text>

    <rect x="470" y="340" width="280" height="140" fill="#EDE7D8"/>
    <text x="492" y="386" font-size="24" fill="#2A2724">Geographic analysis</text>
    <text x="492" y="418" font-size="24" fill="#2A2724">run at the moment</text>
    <text x="492" y="450" font-size="24" fill="#2A2724">a point is opened</text>

    <rect x="800" y="340" width="360" height="140" fill="#B85C1A"/>
    <text x="822" y="386" font-size="26" fill="#F5F1E8">Computed</text>
    <text x="822" y="420" font-size="22" fill="#F3DCC9">Water within 100 or 200</text>
    <text x="822" y="452" font-size="22" fill="#F3DCC9">metres, zone overlaps</text>
  </g>

  <!-- LANE 3 · empirical -->
  <g>
    <rect x="40" y="520" width="380" height="140" fill="#FFFFFF"/>
    <rect x="40" y="520" width="380" height="5" fill="#6B655C"/>
    <text x="62" y="566" font-size="26" fill="#2A2724">Practitioners on site</text>
    <text x="62" y="600" font-size="22" fill="#6B655C">Photos, notes, conditions</text>
    <text x="62" y="632" font-size="22" fill="#6B655C">Reported after the night</text>

    <rect x="470" y="520" width="280" height="140" fill="#EDE7D8"/>
    <text x="492" y="566" font-size="24" fill="#2A2724">Moderated by the</text>
    <text x="492" y="598" font-size="24" fill="#2A2724">territory, with no</text>
    <text x="492" y="630" font-size="24" fill="#2A2724">ranking attached</text>

    <rect x="800" y="520" width="360" height="140" fill="#4A443C"/>
    <text x="822" y="566" font-size="26" fill="#F5F1E8">Empirical</text>
    <text x="822" y="600" font-size="22" fill="#CFC9BE">Field reports, dated,</text>
    <text x="822" y="632" font-size="22" fill="#CFC9BE">never presented as a rule</text>
  </g>

  <!-- band -->
  <line x1="40" y1="710" x2="1160" y2="710" stroke="#2A2724" stroke-width="2"/>
  <text x="40" y="754" font-size="24" fill="#2A2724">A map knows that a spring exists. Only a walker knows whether it was</text>
  <text x="40" y="786" font-size="24" fill="#2A2724">still running last weekend. The interface keeps the two apart, on purpose.</text>
  <text x="1160" y="812" font-size="19" fill="#6B655C" text-anchor="end">Bivouac · data sources</text>

</svg>
