<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Calibri, Carlito, Candara, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- TOKENS  paper #F5F1E8 · green #2D5016 · terra #B85C1A · grey #6B655C · ink #2A2724 -->
  <rect x="0" y="0" width="1200" height="830" fill="#F5F1E8"/>

  <text x="40" y="56" font-size="38" fill="#2A2724">Who regulates bivouac in France</text>
  <line x1="40" y1="78" x2="1160" y2="78" stroke="#2A2724" stroke-width="2"/>

  <!-- connectors -->
  <g fill="none" stroke="#B6AE9E" stroke-width="2">
    <path d="M460 385 C 415 385, 400 205, 370 205"/>
    <path d="M460 385 L 370 385"/>
    <path d="M460 385 C 415 385, 400 565, 370 565"/>
    <path d="M740 385 C 785 385, 800 205, 830 205"/>
    <path d="M740 385 L 830 385"/>
    <path d="M740 385 C 785 385, 800 565, 830 565"/>
  </g>

  <!-- hub -->
  <rect x="460" y="320" width="280" height="130" fill="#2D5016"/>
  <text x="600" y="368" font-size="30" fill="#F5F1E8" text-anchor="middle">One point</text>
  <text x="600" y="402" font-size="30" fill="#F5F1E8" text-anchor="middle">on the map</text>
  <text x="600" y="432" font-size="22" fill="#C9D6B8" text-anchor="middle">six regimes can overlap</text>

  <!-- LEFT · protected-area managers -->
  <g>
    <rect x="40" y="150" width="330" height="110" fill="#FFFFFF"/>
    <rect x="40" y="150" width="330" height="5" fill="#2D5016"/>
    <text x="62" y="195" font-size="26" fill="#2A2724">National park, core zone</text>
    <text x="62" y="228" font-size="22" fill="#6B655C">Park board, under decree</text>
  </g>
  <g>
    <rect x="40" y="330" width="330" height="110" fill="#FFFFFF"/>
    <rect x="40" y="330" width="330" height="5" fill="#2D5016"/>
    <text x="62" y="375" font-size="26" fill="#2A2724">Nature reserve</text>
    <text x="62" y="408" font-size="22" fill="#6B655C">Decree, applied by a manager</text>
  </g>
  <g>
    <rect x="40" y="510" width="330" height="110" fill="#FFFFFF"/>
    <rect x="40" y="510" width="330" height="5" fill="#2D5016"/>
    <text x="62" y="555" font-size="26" fill="#2A2724">Regional park, Natura 2000</text>
    <text x="62" y="588" font-size="22" fill="#6B655C">Charter, relayed by communes</text>
  </g>

  <!-- RIGHT · public authorities and land -->
  <g>
    <rect x="830" y="150" width="330" height="110" fill="#FFFFFF"/>
    <rect x="830" y="150" width="330" height="5" fill="#B85C1A"/>
    <text x="852" y="195" font-size="26" fill="#2A2724">Prefectural order</text>
    <text x="852" y="228" font-size="22" fill="#6B655C">Département, often seasonal</text>
  </g>
  <g>
    <rect x="830" y="330" width="330" height="110" fill="#FFFFFF"/>
    <rect x="830" y="330" width="330" height="5" fill="#B85C1A"/>
    <text x="852" y="375" font-size="26" fill="#2A2724">Municipal order</text>
    <text x="852" y="408" font-size="22" fill="#6B655C">One commune, one lake</text>
  </g>
  <g>
    <rect x="830" y="510" width="330" height="110" fill="#FFFFFF"/>
    <rect x="830" y="510" width="330" height="5" fill="#6B655C"/>
    <text x="852" y="555" font-size="26" fill="#2A2724">Forest and private land</text>
    <text x="852" y="588" font-size="22" fill="#6B655C">Owner or forestry service</text>
  </g>

  <!-- band -->
  <line x1="40" y1="680" x2="1160" y2="680" stroke="#2A2724" stroke-width="2"/>
  <text x="40" y="724" font-size="24" fill="#2A2724">Each regime has its own issuing body, its own wording and its own</text>
  <text x="40" y="756" font-size="24" fill="#2A2724">publication channel. The visitor has to resolve all of it alone, on site.</text>

  <g font-size="19" fill="#6B655C">
    <rect x="40" y="787" width="15" height="15" fill="#2D5016"/>
    <text x="64" y="800">Protected-area managers</text>
    <rect x="330" y="787" width="15" height="15" fill="#B85C1A"/>
    <text x="354" y="800">Public authorities</text>
    <rect x="560" y="787" width="15" height="15" fill="#6B655C"/>
    <text x="584" y="800">Land ownership</text>
    <text x="1160" y="800" text-anchor="end">Bivouac · regulatory landscape mapping</text>
  </g>

</svg>
