<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Calibri, Carlito, Candara, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- TOKENS  paper #F5F1E8 · green #2D5016 · terra #B85C1A · grey #6B655C · ink #2A2724 -->
  <rect x="0" y="0" width="1200" height="830" fill="#F5F1E8"/>

  <text x="40" y="56" font-size="38" fill="#2A2724">One night out, five moments</text>
  <line x1="40" y1="78" x2="1160" y2="78" stroke="#2A2724" stroke-width="2"/>
  <text x="40" y="116" font-size="22" fill="#6B655C">Where regulatory information should reach the hiker, and where it never does</text>

  <!-- spine -->
  <line x1="72" y1="160" x2="72" y2="700" stroke="#B6AE9E" stroke-width="2"/>

  <!-- STEP 1 -->
  <circle cx="72" cy="190" r="11" fill="#2D5016"/>
  <text x="112" y="184" font-size="26" fill="#2A2724">Weeks before · the idea</text>
  <text x="112" y="216" font-size="22" fill="#6B655C">A photograph on social media sets the destination</text>
  <rect x="700" y="162" width="460" height="58" fill="#FFFFFF"/>
  <rect x="700" y="162" width="6" height="58" fill="#B85C1A"/>
  <text x="724" y="198" font-size="22" fill="#B85C1A">Nothing signals a protected area</text>

  <!-- STEP 2 -->
  <circle cx="72" cy="300" r="11" fill="#2D5016"/>
  <text x="112" y="294" font-size="26" fill="#2A2724">Days before · planning</text>
  <text x="112" y="326" font-size="22" fill="#6B655C">Route drawn on a map app, weather checked</text>
  <rect x="700" y="272" width="460" height="58" fill="#FFFFFF"/>
  <rect x="700" y="272" width="6" height="58" fill="#B85C1A"/>
  <text x="724" y="308" font-size="22" fill="#B85C1A">Rules exist, scattered across ten sites</text>

  <!-- STEP 3 -->
  <circle cx="72" cy="410" r="11" fill="#2D5016"/>
  <text x="112" y="404" font-size="26" fill="#2A2724">Morning · the trailhead</text>
  <text x="112" y="436" font-size="22" fill="#6B655C">Car park, last bars of network</text>
  <rect x="700" y="382" width="460" height="58" fill="#FFFFFF"/>
  <rect x="700" y="382" width="6" height="58" fill="#6B655C"/>
  <text x="724" y="418" font-size="22" fill="#6B655C">A sign, when the site has one</text>

  <!-- STEP 4 -->
  <circle cx="72" cy="520" r="11" fill="#2D5016"/>
  <text x="112" y="514" font-size="26" fill="#2A2724">Afternoon · the climb</text>
  <text x="112" y="546" font-size="22" fill="#6B655C">Above the valley, no signal at all</text>
  <rect x="700" y="492" width="460" height="58" fill="#FFFFFF"/>
  <rect x="700" y="492" width="6" height="58" fill="#B85C1A"/>
  <text x="724" y="528" font-size="22" fill="#B85C1A">Nothing can be looked up now</text>

  <!-- STEP 5 · decision -->
  <circle cx="72" cy="630" r="14" fill="#B85C1A"/>
  <text x="112" y="624" font-size="26" fill="#2A2724">Seven in the evening · the decision</text>
  <text x="112" y="656" font-size="22" fill="#6B655C">Pitch here, or walk another hour</text>
  <rect x="700" y="602" width="460" height="58" fill="#B85C1A"/>
  <text x="724" y="638" font-size="22" fill="#F5F1E8">The only moment the rule matters</text>

  <!-- band -->
  <line x1="40" y1="710" x2="1160" y2="710" stroke="#2A2724" stroke-width="2"/>
  <text x="40" y="754" font-size="24" fill="#2A2724">The rule has to be delivered while the phone still has signal, at planning</text>
  <text x="40" y="786" font-size="24" fill="#2A2724">time, and held offline until the moment the decision is actually made.</text>
  <text x="1160" y="812" font-size="19" fill="#6B655C" text-anchor="end">Bivouac · user journey</text>

</svg>
